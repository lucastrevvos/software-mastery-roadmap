name: Upgrade Amaris Interview Copilot V2
on:
  push:
    paths:
      - '.github/workflows/upgrade-amaris-v2.yml'
      - 'scripts/upgrade_amaris_v2.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade page
        run: python scripts/upgrade_amaris_v2.py
      - name: Commit V2
        run: |
          rm -f scripts/upgrade_amaris_v2.py .github/workflows/upgrade-amaris-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/amaris-fullstack-interview.html scripts/upgrade_amaris_v2.py .github/workflows/upgrade-amaris-v2.yml
          git commit -m "feat: upgrade Amaris interview copilot to V2"
          git push
