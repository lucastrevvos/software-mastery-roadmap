name: Upgrade Amaris Interview Copilot V4

on:
  push:
    paths:
      - 'tools/upgrade_amaris_v4.py'
      - '.github/workflows/upgrade-amaris-v4.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize V3 marker for V4 upgrader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/upgrade_amaris_v4.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("marker = '\\n];\\nconst shortOverrides='", "marker = '\\n];\\n\\nconst shortOverrides='")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build V4
        run: python tools/upgrade_amaris_v4.py
      - name: Commit V4
        run: |
          if git diff --quiet -- docs/amaris-fullstack-interview.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/amaris-fullstack-interview.html
          git commit -m "feat: expand Amaris interview copilot to V4"
          git push
