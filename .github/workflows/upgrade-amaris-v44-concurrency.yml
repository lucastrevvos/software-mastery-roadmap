name: Upgrade Amaris Interview Copilot V4.4

on:
  push:
    paths:
      - 'tools/upgrade_amaris_v44_concurrency.py'
      - '.github/workflows/upgrade-amaris-v44-concurrency.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V4.4 concurrency expansion
        run: python tools/upgrade_amaris_v44_concurrency.py
      - name: Commit V4.4
        run: |
          if git diff --quiet -- docs/amaris-fullstack-interview.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/amaris-fullstack-interview.html
          git commit -m "feat: add concurrency and CPU-bound interview cards"
          git push
