<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Detalhes, progresso e anotações de um item do Software Mastery Roadmap.">
  <title>Curso · Software Mastery Roadmap</title>
  <link rel="stylesheet" href="css/app.css?v=1.9.0">
  <link rel="stylesheet" href="css/course.css?v=1.9.0">
</head>
<body>
  <header class="course-hero shell">
    <a class="back-link" href="index.html">← Voltar ao roadmap</a>
    <p class="eyebrow" id="course-phase">ROADMAP</p>
    <div class="course-heading-row">
      <div>
        <h1 id="course-title">Carregando…</h1>
        <p id="course-description" class="course-lead"></p>
      </div>
      <span id="course-status" class="status status-not-started">—</span>
    </div>
  </header>

  <main class="shell course-layout">
    <section class="panel course-overview">
      <div class="section-head"><div><p class="eyebrow">VISÃO GERAL</p><h2>Curso / credencial</h2></div></div>
      <div id="course-meta" class="course-meta-grid"></div>
      <div id="course-links" class="course-links"></div>
    </section>

    <section id="progress-panel" class="panel">
      <div class="section-head"><div><p class="eyebrow">PROGRESSO</p><h2>Onde estou</h2></div></div>
      <div id="course-progress"></div>
    </section>

    <section id="focus-panel" class="panel">
      <div class="section-head"><div><p class="eyebrow">CONTEÚDO</p><h2>O que estudar / dominar</h2></div></div>
      <div id="course-focus"></div>
    </section>

    <section class="panel notes-panel">
      <div class="section-head">
        <div><p class="eyebrow">BASE PESSOAL DE CONHECIMENTO</p><h2>Anotações & resumos</h2></div>
        <small id="notes-count"></small>
      </div>
      <div id="course-notes-page" class="course-notes-page"></div>
    </section>
  </main>

  <footer class="shell footer">
    <span>Software Mastery Roadmap</span>
    <a href="index.html">Trilha completa</a>
  </footer>

  <script src="js/course.js?v=1.9.0" defer></script>
</body>
</html>
